{% extends "base.html" %}

{% block content %}
<div class="card" style="max-width: 500px; margin: 0 auto;">
    <h2>🔐 Login to HomeStuff</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }}" style="padding: var(--space-md); margin-bottom: var(--space-md); border-radius: var(--radius-md); background-color: {{ 'var(--color-danger-light)' if category == 'error' else 'var(--color-success-light)' }}; color: {{ 'var(--color-danger)' if category == 'error' else 'var(--color-success)' }}; font-weight: 600;">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('auth.login') }}">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required autocomplete="username" />
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required autocomplete="current-password" />
        </div>

        <button type="submit">Login</button>
    </form>

    <p class="text-center" style="margin-top: var(--space-lg); color: var(--color-text-secondary);">
        Don't have an account? <a href="{{ url_for('auth.register') }}" style="color: var(--color-primary); font-weight: 600;">Register here</a>
    </p>
</div>
{% endblock %}
