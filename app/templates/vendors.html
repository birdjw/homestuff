{% extends "base.html" %}

{% block content %}
<div class="card">
  <h2>Vendors</h2>
  
  <form id="vendor-form" class="form-inline">
    <div class="form-group">
      <label for="vendor-name">Vendor Name</label>
      <input type="text" id="vendor-name" placeholder="e.g., Costco, Target" required />
    </div>
    <button type="submit">Add Vendor</button>
  </form>
  
  <div id="vendors-list"></div>
</div>
{% endblock %}
