{% extends "base.html" %}

{% block content %}
<div class="container" style="max-width: 400px; margin: 50px auto;">
    <h1>Login to HomeStuff</h1>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }}" style="padding: 10px; margin: 10px 0; border-radius: 4px; background-color: {{ 'lightcoral' if category == 'error' else 'lightgreen' }};">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('auth.login') }}" style="margin-top: 20px;">
        <div style="margin-bottom: 15px;">
            <label for="username" style="display: block; margin-bottom: 5px; font-weight: bold;">Username:</label>
            <input type="text" id="username" name="username" required 
                   style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
        </div>

        <div style="margin-bottom: 20px;">
            <label for="password" style="display: block; margin-bottom: 5px; font-weight: bold;">Password:</label>
            <input type="password" id="password" name="password" required 
                   style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
        </div>

        <button type="submit" style="width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px;">
            Login
        </button>
    </form>

    <p style="margin-top: 20px; text-align: center;">
        Don't have an account? <a href="{{ url_for('auth.register') }}" style="color: #007bff;">Register here</a>
    </p>
</div>
{% endblock %}
